<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#ff4fa3"/><stop offset="0.5" stop-color="#ffb3d9"/><stop offset="1" stop-color="#ff4fa3"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.line { font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size:34px; font-weight:700; fill:url(#g); text-anchor:middle;
  opacity:0; transform-box:fill-box; animation:cycle 9.6s ease-in-out infinite; filter:url(#glow); }
@keyframes cycle {
  0% { opacity:0; transform:translateY(14px); filter:blur(4px); }
  4.00% { opacity:1; transform:translateY(0); filter:blur(0); }
  28.33% { opacity:1; transform:translateY(0); filter:blur(0); }
  33.33% { opacity:0; transform:translateY(-14px); filter:blur(4px); }
  100% { opacity:0; }
}
</style>
<text x="450" y="58" class="line" style="animation-delay:0.0s">Hi, I'm midex</text>
<text x="450" y="58" class="line" style="animation-delay:3.2s">I make Garry's Mod addons</text>
<text x="450" y="58" class="line" style="animation-delay:6.4s">Owner of the Facts Sandbox server</text>
</svg>