<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ffb3d9"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f17"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
</defs>
<style>
.t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;font-size:20px;font-weight:700;fill:#ff8cc6}
.d{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;font-size:13.5px;fill:#c9d1d9}
.l{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;font-size:12.5px;fill:#8b949e}
.shine{animation:sh 4s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<rect x="1.5" y="1.5" width="437" height="147" rx="14" fill="url(#bg)" stroke="url(#b)" stroke-width="2" class="shine"/>
<text x="24" y="44" class="t">Workshop Drop</text>
<text x="24" y="78" class="d">Paste a Steam Workshop link, get the addon</text>
<text x="24" y="98" class="d">installed on your Garry's Mod server.</text>
<circle cx="30" cy="128" r="6" fill="#dea584"/><text x="42" y="132" class="l">Rust</text>
<text x="416" y="132" class="l" text-anchor="end">evgenevgenuk/workshop-drop</text>
</svg>